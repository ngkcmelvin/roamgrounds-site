<svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg">
  <!-- signal arcs -->
  <g transform="translate(180,260)">
    <path d="M -110 0 A 110 110 0 0 1 110 0" fill="none" stroke="#14B8AE" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
    <path d="M -78 0 A 78 78 0 0 1 78 0" fill="none" stroke="#14B8AE" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
    <path d="M -46 0 A 46 46 0 0 1 46 0" fill="none" stroke="#14B8AE" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- phone -->
  <g transform="translate(130,140)">
    <rect x="0" y="0" width="150" height="260" rx="24" fill="#1B2540"/>
    <rect x="10" y="14" width="130" height="232" rx="10" fill="#F5FAF8"/>
    <!-- sim chip on screen -->
    <g transform="translate(45,90)">
      <rect x="0" y="0" width="60" height="44" rx="7" fill="none" stroke="#FF6B4A" stroke-width="3"/>
      <rect x="0" y="0" width="60" height="44" rx="7" fill="#FF6B4A" opacity="0.12"/>
      <line x1="0" y1="15" x2="60" y2="15" stroke="#FF6B4A" stroke-width="2" opacity="0.5"/>
      <line x1="20" y1="0" x2="20" y2="44" stroke="#FF6B4A" stroke-width="2" opacity="0.5"/>
    </g>
    <circle cx="75" cy="230" r="6" fill="#1B2540" opacity="0.2"/>
  </g>

  <!-- floating accent dots -->
  <circle cx="360" cy="90" r="12" fill="#FFC94A"/>
  <circle cx="400" cy="180" r="8" fill="#FF3D6E"/>
  <circle cx="370" cy="270" r="10" fill="#7C5CFF"/>
</svg>
