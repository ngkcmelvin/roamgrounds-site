# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: ngkcmelvin/roamgrounds-site
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/c96ea4c2-382e-45ff-99e7-4d8227da5371/pkce
  auth_token_endpoint: /sites/c96ea4c2-382e-45ff-99e7-4d8227da5371/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://roamgrounds.com

media_folder: "content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "guides"
    label: "Guides"
    files:
      - file: "content/guides.json"
        label: "All Guides"
        name: "guides"
        fields:
          - label: "Guides"
            name: "guides"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Slug (used in the guide URL, no spaces)", name: "slug", widget: "string", hint: "e.g. thailand-dtv — must be unique"}
              - {label: "Category", name: "category", widget: "select", options: ["Visa","Insurance","Tax","eSIM","Lifestyle","Money"]}
              - {label: "Badge Color", name: "color", widget: "select", options: ["coral","teal","sun","grape","pink"]}
              - {label: "Read Time", name: "readTime", widget: "string", hint: "e.g. 8 min"}
              - {label: "Tags", name: "tags", widget: "list"}
              - {label: "Summary", name: "summary", widget: "text"}
              - {label: "Full Guide Content", name: "body", widget: "markdown", required: false, hint: "Leave blank for now if this guide isn't written yet — the card will show but the 'Read guide' link won't work until this has content."}

  - name: "visas"
    label: "Visa Programs"
    files:
      - file: "content/visas.json"
        label: "All Visa Programs"
        name: "visas"
        fields:
          - label: "Programs"
            name: "programs"
            widget: "list"
            summary: "{{country}} — {{name}}"
            fields:
              - {label: "Country", name: "country", widget: "string"}
              - {label: "Program Name", name: "name", widget: "string"}
              - {label: "Badge Color", name: "color", widget: "select", options: ["coral","teal","sun","grape","pink"]}
              - {label: "Sticker Label", name: "stickerLabel", widget: "string", hint: "Short text on the badge, e.g. 5 YR VALID"}
              - {label: "Type", name: "type", widget: "select", options: ["dedicated","workaround"]}
              - {label: "Income Requirement", name: "income", widget: "string"}
              - {label: "Funds / Deposit", name: "funds", widget: "string"}
              - {label: "Duration", name: "duration", widget: "string"}
              - {label: "Cost", name: "cost", widget: "string"}
              - {label: "Tax Treatment", name: "tax", widget: "string"}
              - {label: "Note", name: "note", widget: "text"}
              - label: "Sort Values"
                name: "sortKeys"
                widget: "object"
                hint: "Used only for the 'longest stay' / 'lowest income' filter buttons — not shown to visitors"
                fields:
                  - {label: "Duration in years (e.g. 0.25 for 90 days)", name: "longStay", widget: "number", value_type: "float"}
                  - {label: "Annual income figure", name: "income", widget: "number"}

  - name: "esim"
    label: "eSIM Providers"
    files:
      - file: "content/esim.json"
        label: "All eSIM Providers"
        name: "esim"
        fields:
          - label: "Providers"
            name: "providers"
            widget: "list"
            summary: "{{provider}} — {{name}}"
            fields:
              - {label: "Provider", name: "provider", widget: "string"}
              - {label: "Plan Name", name: "name", widget: "string"}
              - {label: "Badge Color", name: "color", widget: "select", options: ["coral","teal","sun","grape","pink"]}
              - {label: "Sticker Label", name: "stickerLabel", widget: "string"}
              - {label: "Type", name: "type", widget: "select", options: ["core","specialist"]}
              - {label: "Coverage", name: "coverage", widget: "string"}
              - {label: "Data", name: "data", widget: "string"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Tethering", name: "tethering", widget: "string"}
              - label: "Flag Countries (pick every country this plan covers)"
                name: "flagCodes"
                widget: "select"
                multiple: true
                required: false
                hint: "Renders as real flag icons that work on every device. Leave empty and use the emoji field below only for non-country icons like a globe."
                options:
                  - {label: "Thailand", value: "th"}
                  - {label: "Malaysia", value: "my"}
                  - {label: "Indonesia", value: "id"}
                  - {label: "Japan", value: "jp"}
                  - {label: "Vietnam", value: "vn"}
                  - {label: "Philippines", value: "ph"}
                  - {label: "India", value: "in"}
                  - {label: "South Korea", value: "kr"}
                  - {label: "Cambodia", value: "kh"}
                  - {label: "Singapore", value: "sg"}
                  - {label: "China", value: "cn"}
                  - {label: "Taiwan", value: "tw"}
                  - {label: "Laos", value: "la"}
                  - {label: "Myanmar", value: "mm"}
                  - {label: "Hong Kong", value: "hk"}
                  - {label: "Macau", value: "mo"}
                  - {label: "United States", value: "us"}
                  - {label: "United Kingdom", value: "gb"}
                  - {label: "Australia", value: "au"}
                  - {label: "New Zealand", value: "nz"}
              - {label: "Flags (emoji fallback — non-country icons only, e.g. 🌍✈️🚢)", name: "flags", widget: "string", required: false, hint: "Only used if Flag Countries above is empty. Don't put emoji flags here — they break on Windows."}
              - {label: "Note", name: "note", widget: "text"}
              - {label: "Affiliate Link", name: "affiliateUrl", widget: "string", required: false, hint: "Paste your Impact (or other network) tracking link here. Leave blank until you're approved for this provider."}
              - {label: "Button Text", name: "ctaLabel", widget: "string", required: false, default: "Get this eSIM"}
              - label: "Sort Values"
                name: "sortKeys"
                widget: "object"
                hint: "Used only for the filter buttons — not shown to visitors"
                fields:
                  - {label: "Includes India?", name: "india", widget: "boolean", default: false}
                  - {label: "Unlimited data?", name: "unlimited", widget: "boolean", default: false}
